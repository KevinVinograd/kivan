<!DOCTYPE html>
<html lang="es-AR" translate="no" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- translate="no" stays on <html>: a page translator breaks React and Radix portals. -->
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Hold</title>
    <meta name="description" content="Gestión de cobros, pagos y operación mensual." />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Hold" />
    <meta property="og:description" content="Gestión de cobros, pagos y operación mensual." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hold" />
    <meta name="twitter:description" content="Gestión de cobros, pagos y operación mensual." />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
